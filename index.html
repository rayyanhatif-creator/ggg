<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الحجوزات | نادي بادل</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #c5a059;
            --text-color: #ffffff;
            --text-muted: #c5a059b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: var(--accent-gold); margin: 0; font-size: 24px; }
        .live-indicator {
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #2c3540; padding-bottom: 10px; }
        .tab-btn {
            background: none; border: none; color: var(--text-muted);
            padding: 10px 20px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; border-radius: 5px;
        }
        .tab-btn:hover { color: var(--accent-gold); }
        .tab-btn.active { background-color: var(--accent-gold); color: var(--bg-color); }
        .bookings-table-container {
            background-color: var(--card-bg); border-radius: 8px;
            overflow: hidden; border: 1px solid rgba(197, 160, 89, 0.2);
        }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th {
            background-color: rgba(197, 160, 89, 0.1); color: var(--accent-gold);
            padding: 15px; font-weight: 600; border-bottom: 2px solid rgba(197, 160, 89, 0.3);
        }
        td { padding: 15px; border-bottom: 1px solid #2c3540; font-size: 15px; }
        .status-badge { background-color: rgba(197, 160, 89, 0.2); color: var(--accent-gold); padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .no-data { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>لوحة تحكم الحجوزات الذكية 🎾</h1>
            <p style="color: var(--text-muted); margin: 5px 0 0 0;">حجوزات الملاعب المستلمة من شات البادل تلقائياً</p>
        </div>
        <div class="live-indicator" id="syncStatus" style="background-color: #ffc107; color: #000;">جاري جلب البيانات...</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('today')">حجوزات اليوم</button>
        <button class="tab-btn" onclick="switchTab('tomorrow')">حجوزات بكراً</button>
        <button class="tab-btn" onclick="switchTab('past')">حجوزات سابقة / أمس</button>
        <button class="tab-btn" onclick="switchTab('all')">كل الحجوزات</button>
    </div>

    <div class="bookings-table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم العميل</th>
                    <th>رقم الجوال</th>
                    <th>تاريخ الحجز</th>
                    <th>الوقت</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="bookingsBody">
                <tr><td colspan="5" class="no-data">جاري تحميل البيانات المباشرة...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://daqtkhhlqlkpyppfecel.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_mwiKjxLYtMCXwZ_ZdC7TLA_6Gz4GbiD"; 

    let currentFilter = 'today';
    let allBookings = [];

    async function fetchBookings() {
        try {
            // استخدام طلب مباشر عبر الحقول الأساسية لتجنب تعليق حماية المتصفح
            const url = `${SUPABASE_URL}/rest/v1/bookings?select=*&apikey=${SUPABASE_KEY}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Accept': 'application/json'
                }
            });
            
            if (response.ok) {
                allBookings = await response.json();
                renderBookings();
                const indicator = document.getElementById('syncStatus');
                indicator.style.backgroundColor = "#28a745";
                indicator.style.color = "#ffffff";
                indicator.innerText = "مُتصل ومحدّث";
            } else {
                document.getElementById('syncStatus').style.backgroundColor = "#dc3545";
                document.getElementById('syncStatus').innerText = "خطأ في استجابة قاعدة البيانات";
            }
        } catch (error) {
            console.error(error);
            // محاولة ثانية مخففة في حال رفض المتصفح العادي
            try {
                const altUrl = `${SUPABASE_URL}/rest/v1/bookings?select=*&apikey=${SUPABASE_KEY}`;
                const res = await fetch(altUrl);
                if(res.ok) {
                    allBookings = await res.json();
                    renderBookings();
                    document.getElementById('syncStatus').style.backgroundColor = "#28a745";
                    document.getElementById('syncStatus').innerText = "مُتصل ومحدّث (آمن)";
                    return;
                }
            } catch(e){}
            document.getElementById('syncStatus').style.backgroundColor = "#dc3545";
            document.getElementById('syncStatus').style.color = "#ffffff";
            document.getElementById('syncStatus').innerText = "تأخر الاستجابة من السيرفر";
        }
    }

    function renderBookings() {
        const tbody = document.getElementById('bookingsBody');
        tbody.innerHTML = '';

        const todayStr = new Date().toISOString().split('T')[0];
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];

        let filteredData = allBookings;

        if (currentFilter === 'today') {
            filteredData = allBookings.filter(b => b.booking_date === todayStr);
        } else if (currentFilter === 'tomorrow') {
            filteredData = allBookings.filter(b => b.booking_date === tomorrowStr);
        } else if (currentFilter === 'past') {
            filteredData = allBookings.filter(b => b.booking_date < todayStr);
        }

        if (!filteredData || filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="no-data">لا توجد حجوزات في هذا القسم حالياً.</td></tr>`;
            return;
        }

        filteredData.sort((a,b) => String(a.booking_time).localeCompare(String(b.booking_time)));

        filteredData.forEach(booking => {
            const row = `
                <tr>
                    <td style="font-weight: bold;">${booking.customer_name || '-'}</td>
                    <td>${booking.customer_phone || '-'}</td>
                    <td>${booking.booking_date || '-'}</td>
                    <td style="color: var(--accent-gold); font-weight: bold;">${booking.booking_time || '-'}</td>
                    <td><span class="status-badge">${booking.status || 'مؤكد تلقائياً'}</span></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function switchTab(tabName) {
        currentFilter = tabName;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(event) event.target.classList.add('active');
        renderBookings();
    }

    window.onload = () => {
        fetchBookings();
        setInterval(fetchBookings, 8000); 
    };
</script>

</body>
</html>
